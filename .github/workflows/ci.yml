name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Lint
        run: mise run lint

      - name: Vet
        run: mise run vet

      - name: Vulnerability audit
        run: mise run vuln
